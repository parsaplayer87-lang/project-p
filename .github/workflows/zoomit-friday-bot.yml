name: zoomit-friday-bot

# Chain: every run stops itself after RUN_LIMIT_MINUTES (default 345),
# then starts the next run. The cron is only a safety net if the chain ever breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */5 * * *"

permissions:
  contents: read
  actions: write            # needed to start the next run

# One run at a time. At most one pending run, so the chain never duplicates.
concurrency:
  group: zoomit-friday-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355    # GitHub hard limit for a job is 360 minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Network check (shows which APIs this runner can reach)
        continue-on-error: true
        run: |
          check() {
            v4=$(curl -4 -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "$1" || true)
            any=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "$1" || true)
            echo "IPv4=$v4  default=$any  $1"
          }
          for url in https://www.codebuddy.ai/ https://accounts.theforge.ir/ https://api2.zoomit.ir/ https://serpapi.com/ https://gen.pollinations.ai/ https://openrouter.ai/api/v1/models; do
            check "$url" &
          done
          wait

      - name: Restore bot state (encrypted)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: zoomit-state-${{ github.run_id }}
          restore-keys: |
            zoomit-state-

      - name: Config check (prints yes or no only, never values)
        env:
          V_AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          S_AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          S_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          S_ZOOMIT: ${{ secrets.ZOOMIT_REFRESH_TOKEN }}
          S_CODEBUDDY: ${{ secrets.CODEBUDDY_REFRESH_TOKENS }}
          S_STATE_KEY: ${{ secrets.STATE_KEY }}
          S_AI_PROVIDERS: ${{ secrets.AI_PROVIDERS }}
          S_KILOCODE: ${{ secrets.KILOCODE_TOKENS }}
          S_MEMORY: ${{ secrets.MEMORY_REPO_TOKEN }}
        run: |
          yn() { if [ -n "$1" ]; then echo yes; else echo no; fi; }
          echo "variable AI_BASE_URL set: $(yn "$V_AI_BASE_URL")"
          echo "secret AI_BASE_URL set: $(yn "$S_AI_BASE_URL")"
          echo "secret AI_API_KEY set: $(yn "$S_AI_API_KEY")"
          echo "secret ZOOMIT_REFRESH_TOKEN set: $(yn "$S_ZOOMIT")"
          echo "secret CODEBUDDY_REFRESH_TOKENS set: $(yn "$S_CODEBUDDY")"
          echo "secret STATE_KEY set: $(yn "$S_STATE_KEY")"
          echo "secret AI_PROVIDERS set: $(yn "$S_AI_PROVIDERS")"
          echo "secret KILOCODE_TOKENS set: $(yn "$S_KILOCODE")"
          echo "secret MEMORY_REPO_TOKEN set: $(yn "$S_MEMORY")"

      - name: AI speed check (one tiny request, prints status and time)
        continue-on-error: true
        env:
          AI_URL_X: ${{ vars.AI_BASE_URL || secrets.AI_BASE_URL }}
          AI_KEY_X: ${{ secrets.AI_API_KEY }}
          AI_MODEL_X: ${{ vars.AI_MODELS || secrets.AI_MODELS || 'deepseek-ai/deepseek-v4-flash' }}
        run: |
          if [ -z "$AI_URL_X" ] || [ -z "$AI_KEY_X" ]; then
            echo "AI_BASE_URL or AI_API_KEY is missing, check skipped"
            exit 0
          fi
          curl -sS -m 60 -o /tmp/ai.json -w "HTTP %{http_code} in %{time_total}s\n" \
            "$AI_URL_X/chat/completions" \
            -H "Authorization: Bearer $AI_KEY_X" -H "Content-Type: application/json" \
            -d "{\"model\":\"$AI_MODEL_X\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with one word: OK\"}],\"max_tokens\":20}" || true
          head -c 400 /tmp/ai.json 2>/dev/null; echo

      - name: OAuth AI routes check (kilocode + codebuddy + image, status only)
        continue-on-error: true
        env:
          KC_TOKENS: ${{ secrets.KILOCODE_TOKENS }}
          KC_URL: ${{ vars.KILOCODE_CHAT_URL || 'https://api.kilo.ai/api/openrouter/chat/completions' }}
          KC_MODEL: ${{ vars.KILOCODE_MODELS || 'dots-studio/dots-3-note-preview:free' }}
          CB_REFRESH: ${{ secrets.CODEBUDDY_REFRESH_TOKENS }}
          CB_URL: ${{ vars.CODEBUDDY_CHAT_URL || 'https://www.codebuddy.ai/v2/chat/completions' }}
          CB_REFRESH_URL: ${{ vars.CODEBUDDY_TOKEN_URL || 'https://www.codebuddy.ai/v2/plugin/auth/token/refresh' }}
          POLL_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLL_MODEL: ${{ vars.IMAGE_MODEL || 'flux' }}
        run: |
          body='[{"role":"system","content":"You are helpful."},{"role":"user","content":"Reply with one word: OK"}]'
          tok=$(printf '%s' "$KC_TOKENS" | cut -d, -f1)
          if [ -n "$tok" ]; then
            code=$(curl -4 -sS -m 45 -o /tmp/kc.json -w "%{http_code}" "$KC_URL" \
              -H "Authorization: Bearer $tok" -H "Content-Type: application/json" \
              -d "{\"model\":\"$KC_MODEL\",\"messages\":$body}" 2>/dev/null || printf ERR)
            echo "kilocode $KC_MODEL: HTTP $code"
          else
            echo "kilocode: KILOCODE_TOKENS missing, skipped"
          fi
          rt=$(printf '%s' "$CB_REFRESH" | cut -d, -f1)
          if [ -n "$rt" ]; then
            at=$(curl -4 -sS -m 30 "$CB_REFRESH_URL" \
              -H "Content-Type: application/json" -H "Accept: application/json" \
              -H "User-Agent: IDE/2.63.2 CodeBuddy/2.63.2" -H "X-Requested-With: XMLHttpRequest" \
              -H "X-Domain: www.codebuddy.ai" -H "X-Product: SaaS" \
              -H "X-Refresh-Token: $rt" -H "X-Auth-Refresh-Source: plugin" -d "{}" 2>/dev/null \
              | python3 -c 'import json,sys; print((json.load(sys.stdin).get("data") or {}).get("accessToken",""))' 2>/dev/null || true)
            if [ -n "$at" ]; then
              rid=$(python3 -c 'import uuid; print(uuid.uuid4())')
              code=$(curl -4 -sS -m 60 -o /tmp/cb.json -w "%{http_code}" "$CB_URL" \
                -H "Authorization: Bearer $at" -H "Content-Type: application/json" \
                -H "User-Agent: IDE/2.108.1 CodeBuddy/2.108.1" -H "X-Product: SaaS" \
                -H "X-IDE-Type: IDE" -H "X-IDE-Name: IDE" -H "x-requested-with: XMLHttpRequest" \
                -H "x-codebuddy-request: 1" -H "X-Domain: www.codebuddy.ai" \
                -H "X-Request-ID: $rid" -H "X-Conversation-ID: $(python3 -c 'import uuid; print(uuid.uuid4())')" \
                -H "X-Conversation-Request-ID: $rid" -H "X-Conversation-Message-ID: $rid" \
                -d '{"model":"deepseek-v4.1-flash","messages":[{"role":"system","content":"You are helpful."},{"role":"user","content":"Reply with one word: OK"}],"max_tokens":20,"stream":true}' 2>/dev/null || printf ERR)
              echo "codebuddy deepseek-v4.1-flash: HTTP $code"
            else
              echo "codebuddy: token refresh failed"
            fi
          else
            echo "codebuddy: CODEBUDDY_REFRESH_TOKENS missing, skipped"
          fi
          if [ -n "$POLL_KEY" ]; then
            pcode=$(curl -4 -sS -m 120 -o /tmp/poll.bin -w "%{http_code}" \
              "https://gen.pollinations.ai/image/test%20blue%20robot?model=$POLL_MODEL&width=256&height=256&nologo=true" \
              -H "Authorization: Bearer $POLL_KEY" 2>/dev/null || printf ERR)
            size=$(wc -c < /tmp/poll.bin 2>/dev/null || echo 0)
            echo "pollinations $POLL_MODEL: HTTP $pcode, $size bytes"
          else
            echo "pollinations: POLLINATIONS_API_KEY missing, skipped"
          fi

      - name: Run bot
        env:
          PLATFORM: ${{ vars.PLATFORM || 'zoomit' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          RUN_LIMIT_MINUTES: ${{ vars.RUN_LIMIT_MINUTES || '345' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'flux' }}
          RESET_PROCESSED: ${{ vars.RESET_PROCESSED || 'false' }}
          CODEBUDDY_CHAT_URL: ${{ vars.CODEBUDDY_CHAT_URL }}
          CODEBUDDY_EXTRA_HEADERS: ${{ vars.CODEBUDDY_EXTRA_HEADERS }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || secrets.AI_BASE_URL }}
          AI_MODELS: ${{ vars.AI_MODELS || secrets.AI_MODELS }}
          AI_PROVIDERS: ${{ secrets.AI_PROVIDERS }}
          AI_TOTAL_BUDGET_SEC: ${{ vars.AI_TOTAL_BUDGET_SEC }}
          FORCE_IPV4: ${{ vars.FORCE_IPV4 || 'false' }}
          ZOOMIT_REFRESH_TOKEN: ${{ secrets.ZOOMIT_REFRESH_TOKEN }}
          CODEBUDDY_REFRESH_TOKENS: ${{ secrets.CODEBUDDY_REFRESH_TOKENS }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          KILOCODE_TOKENS: ${{ secrets.KILOCODE_TOKENS }}
          MEMORY_REPO_TOKEN: ${{ secrets.MEMORY_REPO_TOKEN }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          ZOOMIT_TEAM_INFO: ${{ secrets.ZOOMIT_TEAM_INFO }}
          MEMORY_MESSAGES: ${{ vars.MEMORY_MESSAGES || '10' }}
          SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'serpapi' }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTIF_READ_TEMPLATE: ${{ vars.NOTIF_READ_TEMPLATE }}
          NOTIF_READ_AUTODISCOVER: ${{ vars.NOTIF_READ_AUTODISCOVER || 'true' }}
        run: python main.py

      - name: Save bot state (encrypted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: zoomit-state-${{ github.run_id }}

      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run zoomit-friday-bot.yml --ref "$GITHUB_REF_NAME"
