name: zoomit-friday-bot

# Chain: every run stops itself after RUN_LIMIT_MINUTES (default 345),
# then starts the next run. The cron is only a safety net if the chain ever breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */5 * * *"

permissions:
  contents: read
  actions: write            # needed to start the next run

# One run at a time. At most one pending run, so the chain never duplicates.
concurrency:
  group: zoomit-friday-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355    # GitHub hard limit for a job is 360 minutes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Network check (shows which APIs this runner can reach)
        continue-on-error: true
        run: |
          for url in https://www.codebuddy.ai/ https://accounts.theforge.ir/ https://api2.zoomit.ir/ https://serpapi.com/ https://gen.pollinations.ai/ https://openrouter.ai/api/v1/models; do
            v4=$(curl -4 -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "$url" || true)
            any=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 "$url" || true)
            echo "IPv4=$v4  default=$any  $url"
          done

      - name: Restore bot state (encrypted)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: zoomit-state-${{ github.run_id }}
          restore-keys: |
            zoomit-state-

      - name: Config check (prints yes or no only, never values)
        env:
          V_AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          S_AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          S_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          S_ZOOMIT: ${{ secrets.ZOOMIT_REFRESH_TOKEN }}
          S_CODEBUDDY: ${{ secrets.CODEBUDDY_REFRESH_TOKENS }}
          S_STATE_KEY: ${{ secrets.STATE_KEY }}
          S_AI_PROVIDERS: ${{ secrets.AI_PROVIDERS }}
        run: |
          yn() { if [ -n "$1" ]; then echo yes; else echo no; fi; }
          echo "variable AI_BASE_URL set: $(yn "$V_AI_BASE_URL")"
          echo "secret AI_BASE_URL set: $(yn "$S_AI_BASE_URL")"
          echo "secret AI_API_KEY set: $(yn "$S_AI_API_KEY")"
          echo "secret ZOOMIT_REFRESH_TOKEN set: $(yn "$S_ZOOMIT")"
          echo "secret CODEBUDDY_REFRESH_TOKENS set: $(yn "$S_CODEBUDDY")"
          echo "secret STATE_KEY set: $(yn "$S_STATE_KEY")"
          echo "secret AI_PROVIDERS set: $(yn "$S_AI_PROVIDERS")"

      - name: AI speed check (one tiny request, prints status and time)
        continue-on-error: true
        env:
          AI_URL_X: ${{ vars.AI_BASE_URL || secrets.AI_BASE_URL }}
          AI_KEY_X: ${{ secrets.AI_API_KEY }}
          AI_MODEL_X: ${{ vars.AI_MODELS || secrets.AI_MODELS || 'deepseek-ai/deepseek-v4-flash' }}
        run: |
          if [ -z "$AI_URL_X" ] || [ -z "$AI_KEY_X" ]; then
            echo "AI_BASE_URL or AI_API_KEY is missing, check skipped"
            exit 0
          fi
          curl -sS -m 150 -o /tmp/ai.json -w "HTTP %{http_code} in %{time_total}s\n" \
            "$AI_URL_X/chat/completions" \
            -H "Authorization: Bearer $AI_KEY_X" -H "Content-Type: application/json" \
            -d "{\"model\":\"$AI_MODEL_X\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with one word: OK\"}],\"max_tokens\":20}" || true
          head -c 400 /tmp/ai.json 2>/dev/null; echo

      - name: Run bot
        env:
          PLATFORM: ${{ vars.PLATFORM || 'zoomit' }}
          DRY_RUN: ${{ vars.DRY_RUN || 'false' }}
          RUN_LIMIT_MINUTES: ${{ vars.RUN_LIMIT_MINUTES || '345' }}
          IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'flux' }}
          RESET_PROCESSED: ${{ vars.RESET_PROCESSED || 'false' }}
          CODEBUDDY_CHAT_URL: ${{ vars.CODEBUDDY_CHAT_URL }}
          CODEBUDDY_EXTRA_HEADERS: ${{ vars.CODEBUDDY_EXTRA_HEADERS }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || secrets.AI_BASE_URL }}
          AI_MODELS: ${{ vars.AI_MODELS || secrets.AI_MODELS }}
          AI_PROVIDERS: ${{ secrets.AI_PROVIDERS }}
          AI_TOTAL_BUDGET_SEC: ${{ vars.AI_TOTAL_BUDGET_SEC }}
          FORCE_IPV4: ${{ vars.FORCE_IPV4 || 'false' }}
          ZOOMIT_REFRESH_TOKEN: ${{ secrets.ZOOMIT_REFRESH_TOKEN }}
          CODEBUDDY_REFRESH_TOKENS: ${{ secrets.CODEBUDDY_REFRESH_TOKENS }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          ZOOMIT_TEAM_INFO: ${{ secrets.ZOOMIT_TEAM_INFO }}
          MEMORY_MESSAGES: ${{ vars.MEMORY_MESSAGES || '10' }}
          SEARCH_PROVIDER: ${{ vars.SEARCH_PROVIDER || 'serpapi' }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTIF_READ_TEMPLATE: ${{ vars.NOTIF_READ_TEMPLATE }}
          NOTIF_READ_AUTODISCOVER: ${{ vars.NOTIF_READ_AUTODISCOVER || 'true' }}
        run: python main.py

      - name: Save bot state (encrypted)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: zoomit-state-${{ github.run_id }}

      - name: Start the next run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run zoomit-friday-bot.yml --ref "$GITHUB_REF_NAME"
